project_id = "future-ready-campus-quest"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = [
  "http://127.0.0.1:4173",
  "http://localhost:5173",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.join-cohort]
verify_jwt = false

[functions.manage-join-window]
verify_jwt = true

[functions.recover-student]
verify_jwt = false

[functions.production-readiness]
verify_jwt = false

[functions.manage-group-identity]
verify_jwt = true

[functions.get-next-item]
verify_jwt = true

[functions.submit-response]
verify_jwt = true

[functions.complete-quest]
verify_jwt = true

[functions.teacher-dashboard]
verify_jwt = true

[functions.teacher-controls]
verify_jwt = true

[functions.export-cohort]
verify_jwt = true
