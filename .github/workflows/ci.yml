name: Verify Campus Quest

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject protected tracked paths
        run: |
          pnpm check:repo
          pnpm check:deployment

      - name: Lint, typecheck, and test
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:functions

      - name: Typecheck Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Function modules
        run: >-
          deno check --frozen
          --config supabase/functions/deno.json
          --lock supabase/functions/deno.lock
          supabase/functions/*/index.ts

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Reset and test database policies
        run: |
          pnpm exec supabase db reset
          pnpm exec supabase test db

      - name: Export local integration credentials
        run: |
          eval "$(pnpm exec supabase status -o env)"
          echo "TEST_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Run black-box Edge and Auth tests
        env:
          ALLOWED_FRONTEND_ORIGINS: http://127.0.0.1:4173,http://127.0.0.1:4174
          FRONTEND_APP_URL: http://127.0.0.1:4174
          TEST_FRONTEND_APP_URL: http://127.0.0.1:4174
          JOIN_TOKEN_SIGNING_SECRET: ci-only-join-signing-secret-32-bytes-minimum
          RECOVERY_TOKEN_SIGNING_SECRET: ci-only-recovery-signing-secret-32-bytes
          STUDENT_LOGIN_SIGNING_SECRET: ci-only-student-login-signing-secret-32-bytes
          PRODUCTION_READINESS_SECRET: ci-only-readiness-secret-32-bytes-minimum
        run: |
          printf '%s\n' \
            "ALLOWED_FRONTEND_ORIGINS=$ALLOWED_FRONTEND_ORIGINS" \
            "FRONTEND_APP_URL=$FRONTEND_APP_URL" \
            "JOIN_TOKEN_SIGNING_SECRET=$JOIN_TOKEN_SIGNING_SECRET" \
            "RECOVERY_TOKEN_SIGNING_SECRET=$RECOVERY_TOKEN_SIGNING_SECRET" \
            "STUDENT_LOGIN_SIGNING_SECRET=$STUDENT_LOGIN_SIGNING_SECRET" \
            "PRODUCTION_READINESS_SECRET=$PRODUCTION_READINESS_SECRET" \
            > /tmp/campus-quest-functions.env
          pnpm exec supabase functions serve \
            --env-file /tmp/campus-quest-functions.env \
            > /tmp/campus-quest-functions.log 2>&1 &
          for readiness_function in join-cohort recover-student student-login; do
            response_code=000
            for attempt in $(seq 1 30); do
              response_code="$(curl --silent --output /dev/null \
                --write-out '%{http_code}' \
                --header 'Origin: http://127.0.0.1:4173' \
                "http://127.0.0.1:54321/functions/v1/$readiness_function" \
                || true)"
              if [ "$response_code" = "405" ]; then
                break
              fi
              sleep 1
            done
            test "$response_code" = "405"
          done
          pnpm test:integration

      - name: Build and scan the public artifact
        run: |
          pnpm build
          pnpm check:bundle

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Bootstrap disposable full-stack classroom
        env:
          SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          LOCAL_TEACHER_EMAIL: ci-full-stack-teacher@example.invalid
          LOCAL_TEACHER_PASSWORD: ci-only-full-stack-teacher-password
          LOCAL_SYNTHETIC_CONTENT: "1"
        run: >-
          pnpm bootstrap:local tests/fixtures/public-synthetic-bank.json

      - name: Run hosted classroom full-stack gate
        env:
          LOCAL_CLASSROOM_E2E: "1"
          LOCAL_TEACHER_EMAIL: ci-full-stack-teacher@example.invalid
          LOCAL_TEACHER_PASSWORD: ci-only-full-stack-teacher-password
          TEST_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm test:e2e:classroom

      - name: Run browser smoke tests
        run: pnpm playwright test

      - name: Validate representative 30-student load plan
        run: pnpm test:load

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
