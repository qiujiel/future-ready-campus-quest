name: Verify Campus Quest

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject protected tracked paths
        run: pnpm check:repo

      - name: Lint, typecheck, and test
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:functions

      - name: Typecheck Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Function modules
        run: deno check supabase/functions/*/index.ts

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Reset and test database policies
        run: |
          pnpm exec supabase db reset
          pnpm exec supabase test db

      - name: Export local integration credentials
        run: |
          eval "$(pnpm exec supabase status -o env)"
          echo "TEST_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Run black-box Edge and Auth tests
        env:
          ALLOWED_FRONTEND_ORIGINS: http://127.0.0.1:4173
          FRONTEND_APP_URL: http://127.0.0.1:4173
          JOIN_TOKEN_SIGNING_SECRET: ci-only-join-signing-secret-32-bytes-minimum
          RECOVERY_TOKEN_SIGNING_SECRET: ci-only-recovery-signing-secret-32-bytes
        run: |
          pnpm exec supabase functions serve > /tmp/campus-quest-functions.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null \
              http://127.0.0.1:54321/functions/v1/join-cohort; then
              break
            fi
            sleep 1
          done
          pnpm test:integration

      - name: Build and scan the public artifact
        run: |
          pnpm build
          pnpm check:bundle

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm playwright test tests/e2e/shell.spec.ts

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
