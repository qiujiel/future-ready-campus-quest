name: Package and Publish GitHub Pages

on:
  workflow_dispatch:

concurrency:
  group: campus-quest-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}
      commit_sha: ${{ steps.integrity.outputs.commit_sha }}
      manifest_digest: ${{ steps.integrity.outputs.manifest_digest }}
    steps:
      - name: Check out approved source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and unit boundaries
        run: |
          pnpm check:repo
          pnpm check:deployment
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:functions

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Check Edge Function modules
        run: >-
          deno check --frozen
          --config supabase/functions/deno.json
          --lock supabase/functions/deno.lock
          supabase/functions/*/index.ts

      - name: Start and verify local Supabase
        run: |
          pnpm exec supabase start
          pnpm exec supabase db reset
          pnpm exec supabase test db
          eval "$(pnpm exec supabase status -o env)"
          echo "TEST_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Run black-box Edge and Auth tests
        env:
          ALLOWED_FRONTEND_ORIGINS: http://127.0.0.1:4173
          FRONTEND_APP_URL: http://127.0.0.1:4173
          JOIN_TOKEN_SIGNING_SECRET: package-only-join-signing-secret-32-bytes-minimum
          RECOVERY_TOKEN_SIGNING_SECRET: package-only-recovery-signing-secret-32-bytes
          PRODUCTION_READINESS_SECRET: package-only-readiness-secret-32-bytes-minimum
        run: |
          printf '%s\n' \
            "ALLOWED_FRONTEND_ORIGINS=$ALLOWED_FRONTEND_ORIGINS" \
            "FRONTEND_APP_URL=$FRONTEND_APP_URL" \
            "JOIN_TOKEN_SIGNING_SECRET=$JOIN_TOKEN_SIGNING_SECRET" \
            "RECOVERY_TOKEN_SIGNING_SECRET=$RECOVERY_TOKEN_SIGNING_SECRET" \
            "PRODUCTION_READINESS_SECRET=$PRODUCTION_READINESS_SECRET" \
            > /tmp/campus-quest-functions.env
          pnpm exec supabase functions serve \
            --env-file /tmp/campus-quest-functions.env \
            > /tmp/campus-quest-functions.log 2>&1 &
          response_code=000
          for attempt in $(seq 1 30); do
            response_code="$(curl --silent --output /dev/null \
              --write-out '%{http_code}' \
              --header 'Origin: http://127.0.0.1:4173' \
              http://127.0.0.1:54321/functions/v1/join-cohort || true)"
            if [ "$response_code" = "405" ]; then
              break
            fi
            sleep 1
          done
          test "$response_code" = "405"
          pnpm test:integration

      - name: Build and scan the public shell
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: |
          pnpm build
          pnpm check:bundle

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser and representative-load gates
        run: |
          pnpm playwright test
          pnpm test:load

      - name: Require dedicated-project 30-student load evidence
        env:
          LOAD_SUPABASE_PROJECT_REF: ${{ vars.LOAD_SUPABASE_PROJECT_REF }}
          LOAD_SUPABASE_URL: ${{ secrets.LOAD_SUPABASE_URL }}
          LOAD_SUPABASE_ANON_KEY: ${{ secrets.LOAD_SUPABASE_ANON_KEY }}
          LOAD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LOAD_SUPABASE_SERVICE_ROLE_KEY }}
          LOAD_TEACHER_ACCESS_TOKEN: ${{ secrets.LOAD_TEACHER_ACCESS_TOKEN }}
          LOAD_COHORT_ID: ${{ vars.LOAD_COHORT_ID }}
          LOAD_JOIN_TOKEN: ${{ secrets.LOAD_JOIN_TOKEN }}
          LOAD_CONTENT_VERSION_ID: ${{ vars.LOAD_CONTENT_VERSION_ID }}
        run: pnpm test:load:live

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

      - name: Create immutable artifact evidence
        id: integrity
        run: |
          node scripts/pages-artifact.mjs create dist \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"

      - name: Upload verified Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist
          retention-days: 90

      - name: Record release evidence
        env:
          ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
          COMMIT_SHA: ${{ steps.integrity.outputs.commit_sha }}
          MANIFEST_DIGEST: ${{ steps.integrity.outputs.manifest_digest }}
        run: |
          printf '%s\n' \
            "### Pages artifact evidence" \
            "- Commit SHA: $COMMIT_SHA" \
            "- Artifact ID: $ARTIFACT_ID" \
            "- Manifest SHA-256: $MANIFEST_DIGEST" \
            >> "$GITHUB_STEP_SUMMARY"

  preflight:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-readiness
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the approved source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Download the exact package artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: /tmp/pages-download
          merge-multiple: true

      - name: Verify the packaged artifact
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.package.outputs.commit_sha }}
          EXPECTED_MANIFEST_DIGEST: ${{ needs.package.outputs.manifest_digest }}
        run: |
          mkdir -p /tmp/pages-verified
          tar -xf /tmp/pages-download/artifact.tar -C /tmp/pages-verified
          node scripts/pages-artifact.mjs verify /tmp/pages-verified \
            --expected-commit "$EXPECTED_COMMIT_SHA" \
            --expected-digest "$EXPECTED_MANIFEST_DIGEST"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked preflight dependencies
        run: pnpm install --frozen-lockfile

      - name: Run read-only production preflight
        env:
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          PRODUCTION_READINESS_SECRET: ${{ secrets.PRODUCTION_READINESS_SECRET }}
          PRODUCTION_FRONTEND_ORIGIN: ${{ vars.PRODUCTION_FRONTEND_ORIGIN }}
          PRODUCTION_CONTENT_VERSION: ${{ vars.PRODUCTION_CONTENT_VERSION }}
          PRODUCTION_SMOKE_TEACHER_ID: ${{ vars.PRODUCTION_SMOKE_TEACHER_ID }}
          PRODUCTION_SMOKE_COHORT_ID: ${{ vars.PRODUCTION_SMOKE_COHORT_ID }}
          LOAD_SUPABASE_PROJECT_REF: ${{ vars.LOAD_SUPABASE_PROJECT_REF }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: node scripts/production-preflight.mjs

  deploy:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish the verified artifact after approval
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
