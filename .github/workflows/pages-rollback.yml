name: Roll Back GitHub Pages

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Pages workflow run containing the retained artifact
        required: true
        type: string
      expected_commit_sha:
        description: Recorded full commit SHA for that artifact
        required: true
        type: string
      expected_manifest_digest:
        description: Recorded artifact manifest SHA-256
        required: true
        type: string

concurrency:
  group: campus-quest-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out rollback verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Validate recorded release identity
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          EXPECTED_MANIFEST_DIGEST: ${{ inputs.expected_manifest_digest }}
        run: |
          printf '%s' "$SOURCE_RUN_ID" | grep -Eq '^[0-9]+$'
          printf '%s' "$EXPECTED_COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EXPECTED_MANIFEST_DIGEST" | grep -Eq '^[0-9a-f]{64}$'

      - name: Download retained Pages artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: github-pages
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/pages-download
          merge-multiple: true

      - name: Verify retained archive without rebuilding
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          EXPECTED_MANIFEST_DIGEST: ${{ inputs.expected_manifest_digest }}
        run: |
          mkdir -p /tmp/pages-verified
          tar -xf /tmp/pages-download/artifact.tar -C /tmp/pages-verified
          node scripts/pages-artifact.mjs verify /tmp/pages-verified \
            --expected-commit "$EXPECTED_COMMIT_SHA" \
            --expected-digest "$EXPECTED_MANIFEST_DIGEST"

      - name: Re-stage the unchanged verified archive
        id: rollback-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: /tmp/pages-download/artifact.tar
          if-no-files-found: error
          retention-days: 90

      - name: Record rollback evidence
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          EXPECTED_MANIFEST_DIGEST: ${{ inputs.expected_manifest_digest }}
          ROLLBACK_ARTIFACT_ID: ${{ steps.rollback-artifact.outputs.artifact-id }}
        run: |
          printf '%s\n' \
            "### Verified Pages rollback evidence" \
            "- Source run ID: $SOURCE_RUN_ID" \
            "- Commit SHA: $EXPECTED_COMMIT_SHA" \
            "- Manifest SHA-256: $EXPECTED_MANIFEST_DIGEST" \
            "- Rollback artifact ID: $ROLLBACK_ARTIFACT_ID" \
            >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish verified retained artifact after approval
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
