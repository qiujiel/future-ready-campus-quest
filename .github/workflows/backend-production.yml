name: Release Production Backend

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full approved main-branch commit SHA
        required: true
        type: string
      production_project_ref:
        description: Confirmed production Supabase project reference
        required: true
        type: string
      release_mode:
        description: Release authorization mode
        required: true
        type: choice
        default: upgrade
        options:
          - upgrade
          - bootstrap
      bootstrap_authorization_id:
        description: Redaction-safe bootstrap authorization identifier
        required: false
        type: string
      backup_evidence_id:
        description: Redaction-safe backup evidence identifier
        required: false
        type: string
      backup_created_at_utc:
        description: Redaction-safe UTC backup completion timestamp
        required: false
        type: string
      backup_archive_sha256:
        description: Redaction-safe SHA-256 for the backup archive
        required: false
        type: string
      restore_rehearsal_evidence_id:
        description: Redaction-safe restore rehearsal evidence identifier
        required: false
        type: string

concurrency:
  group: campus-quest-production-backend
  cancel-in-progress: false

jobs:
  validate_release_authorization:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the approved source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate redaction-safe release authorization
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          BOOTSTRAP_AUTHORIZATION_ID: ${{ inputs.bootstrap_authorization_id }}
          BACKUP_EVIDENCE_ID: ${{ inputs.backup_evidence_id }}
          BACKUP_CREATED_AT_UTC: ${{ inputs.backup_created_at_utc }}
          BACKUP_ARCHIVE_SHA256: ${{ inputs.backup_archive_sha256 }}
          RESTORE_REHEARSAL_EVIDENCE_ID: ${{ inputs.restore_rehearsal_evidence_id }}
        run: node scripts/production-release-authorization.mjs

  release:
    if: github.ref == 'refs/heads/main'
    needs: validate_release_authorization
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-backend
    permissions:
      contents: read
    env:
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      PRODUCTION_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      PRODUCTION_FRONTEND_ORIGIN: ${{ vars.PRODUCTION_FRONTEND_ORIGIN }}
      LOAD_SUPABASE_PROJECT_REF: ${{ vars.LOAD_SUPABASE_PROJECT_REF }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
      RELEASE_MODE: ${{ inputs.release_mode }}
      BOOTSTRAP_AUTHORIZATION_ID: ${{ inputs.bootstrap_authorization_id }}

    steps:
      - name: Validate protected release identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMED_PROJECT_REF: ${{ inputs.production_project_ref }}
        run: |
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "expected_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$CONFIRMED_PROJECT_REF" = "$PRODUCTION_SUPABASE_PROJECT_REF"
          test "$CONFIRMED_PROJECT_REF" = "ghohuwwjxgjqnbsauvzq"
          test "$PRODUCTION_SUPABASE_PROJECT_REF" = "ghohuwwjxgjqnbsauvzq"
          test "$LOAD_SUPABASE_PROJECT_REF" = "vadyhuipwbtgbzpeisbn"
          test "$PRODUCTION_SUPABASE_URL" = "https://ghohuwwjxgjqnbsauvzq.supabase.co"
          test "$PRODUCTION_SUPABASE_PROJECT_REF" != "$LOAD_SUPABASE_PROJECT_REF"

      - name: Check out the approved source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository and workflow boundaries
        run: |
          pnpm check:repo
          pnpm check:deployment
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:functions

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Check Edge Function modules
        run: >-
          deno check --frozen
          --config supabase/functions/deno.json
          --lock supabase/functions/deno.lock
          supabase/functions/*/index.ts

      - name: Start and verify local Supabase
        run: |
          pnpm exec supabase start
          pnpm exec supabase db reset
          pnpm exec supabase test db
          eval "$(pnpm exec supabase status -o env)"
          echo "TEST_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Run black-box Edge and Auth tests
        env:
          ALLOWED_FRONTEND_ORIGINS: http://127.0.0.1:4173
          FRONTEND_APP_URL: http://127.0.0.1:4173
          JOIN_TOKEN_SIGNING_SECRET: release-test-join-signing-secret-32-bytes-minimum
          RECOVERY_TOKEN_SIGNING_SECRET: release-test-recovery-signing-secret-32-bytes
          STUDENT_LOGIN_SIGNING_SECRET: release-test-student-login-signing-secret-32-bytes
          PRODUCTION_READINESS_SECRET: release-test-readiness-secret-32-bytes-minimum
        run: |
          printf '%s\n' \
            "ALLOWED_FRONTEND_ORIGINS=$ALLOWED_FRONTEND_ORIGINS" \
            "FRONTEND_APP_URL=$FRONTEND_APP_URL" \
            "JOIN_TOKEN_SIGNING_SECRET=$JOIN_TOKEN_SIGNING_SECRET" \
            "RECOVERY_TOKEN_SIGNING_SECRET=$RECOVERY_TOKEN_SIGNING_SECRET" \
            "STUDENT_LOGIN_SIGNING_SECRET=$STUDENT_LOGIN_SIGNING_SECRET" \
            "PRODUCTION_READINESS_SECRET=$PRODUCTION_READINESS_SECRET" \
            > /tmp/campus-quest-functions.env
          pnpm exec supabase functions serve \
            --env-file /tmp/campus-quest-functions.env \
            > /tmp/campus-quest-functions.log 2>&1 &
          for readiness_function in join-cohort recover-student student-login; do
            response_code=000
            for attempt in $(seq 1 30); do
              response_code="$(curl --silent --output /dev/null \
                --write-out '%{http_code}' \
                --header 'Origin: http://127.0.0.1:4173' \
                "http://127.0.0.1:54321/functions/v1/$readiness_function" \
                || true)"
              if [ "$response_code" = "405" ]; then
                break
              fi
              sleep 1
            done
            test "$response_code" = "405"
          done
          pnpm test:integration

      - name: Build and scan the public shell
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: |
          pnpm build
          pnpm check:bundle

      - name: Stop local validation services
        if: always()
        run: pnpm exec supabase stop --no-backup

      - name: Link the confirmed production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
        run: |
          pnpm exec supabase link \
            --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF" \
            --password "$PRODUCTION_SUPABASE_DB_PASSWORD"

      - name: Verify empty production bootstrap state
        if: ${{ inputs.release_mode == 'bootstrap' }}
        env:
          BOOTSTRAP_AUTHORIZATION_ID: ${{ inputs.bootstrap_authorization_id }}
          PRODUCTION_SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/production-bootstrap-preflight.mjs

      - name: Record migration state and dry-run pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
        run: |
          pnpm exec supabase migration list \
            --linked \
            --password "$PRODUCTION_SUPABASE_DB_PASSWORD"
          pnpm exec supabase db push --dry-run \
            --linked \
            --password "$PRODUCTION_SUPABASE_DB_PASSWORD"

      - name: Apply ordered production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
        run: |
          pnpm exec supabase db push \
            --linked \
            --password "$PRODUCTION_SUPABASE_DB_PASSWORD"

      - name: Set production Edge Function secrets
        env:
          ALLOWED_FRONTEND_ORIGINS: ${{ secrets.ALLOWED_FRONTEND_ORIGINS }}
          FRONTEND_APP_URL: ${{ secrets.FRONTEND_APP_URL }}
          JOIN_TOKEN_SIGNING_SECRET: ${{ secrets.JOIN_TOKEN_SIGNING_SECRET }}
          RECOVERY_TOKEN_SIGNING_SECRET: ${{ secrets.RECOVERY_TOKEN_SIGNING_SECRET }}
          STUDENT_LOGIN_SIGNING_SECRET: ${{ secrets.STUDENT_LOGIN_SIGNING_SECRET }}
          PRODUCTION_READINESS_SECRET: ${{ secrets.PRODUCTION_READINESS_SECRET }}
          PRODUCTION_SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/production-function-config.mjs
          umask 077
          printf '%s\n' \
            "ALLOWED_FRONTEND_ORIGINS=$ALLOWED_FRONTEND_ORIGINS" \
            "FRONTEND_APP_URL=$FRONTEND_APP_URL" \
            "JOIN_TOKEN_SIGNING_SECRET=$JOIN_TOKEN_SIGNING_SECRET" \
            "RECOVERY_TOKEN_SIGNING_SECRET=$RECOVERY_TOKEN_SIGNING_SECRET" \
            "STUDENT_LOGIN_SIGNING_SECRET=$STUDENT_LOGIN_SIGNING_SECRET" \
            "PRODUCTION_READINESS_SECRET=$PRODUCTION_READINESS_SECRET" \
            "FRCQ_SUPABASE_PUBLISHABLE_KEY=$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            "FRCQ_SUPABASE_SECRET_KEY=$PRODUCTION_SUPABASE_SECRET_KEY" \
            > /tmp/campus-quest-production-functions.env
          pnpm exec supabase secrets set \
            --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF" \
            --env-file /tmp/campus-quest-production-functions.env

      - name: Deploy the exact production Edge Function set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for function_name in complete-quest export-cohort get-next-item join-cohort manage-group-identity manage-join-window production-readiness recover-student student-login submit-response teacher-controls teacher-dashboard; do
            pnpm exec supabase functions deploy "$function_name" \
              --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF"
          done

      - name: Verify the compatible backend release
        env:
          PRODUCTION_READINESS_SECRET: ${{ secrets.PRODUCTION_READINESS_SECRET }}
        run: node scripts/production-preflight.mjs --backend-only

      - name: Remove temporary release material
        if: always()
        run: |
          rm -f /tmp/campus-quest-functions.env
          rm -f /tmp/campus-quest-functions.log
          rm -f /tmp/campus-quest-production-functions.env
