name: Deploy Production Join-Latency Function Fix

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full approved main-branch workflow commit SHA
        required: true
        type: string
      production_project_ref:
        description: Confirmed production Supabase project reference
        required: true
        type: string

concurrency:
  group: campus-quest-production-backend
  cancel-in-progress: false

jobs:
  deploy_fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-backend
    permissions:
      contents: read
    env:
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ inputs.production_project_ref }}
      PRODUCTION_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      PRODUCTION_FRONTEND_ORIGIN: ${{ vars.PRODUCTION_FRONTEND_ORIGIN }}
      PRODUCTION_CONTENT_VERSION: ${{ vars.PRODUCTION_CONTENT_VERSION }}
      PRODUCTION_SMOKE_TEACHER_ID: ${{ vars.PRODUCTION_SMOKE_TEACHER_ID }}
      PRODUCTION_SMOKE_COHORT_ID: ${{ vars.PRODUCTION_SMOKE_COHORT_ID }}
      LOAD_SUPABASE_PROJECT_REF: ${{ vars.LOAD_SUPABASE_PROJECT_REF }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}

    steps:
      - name: Validate exact production target
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "expected_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$PRODUCTION_SUPABASE_PROJECT_REF" = "ghohuwwjxgjqnbsauvzq"
          test "$PRODUCTION_SUPABASE_URL" = "https://ghohuwwjxgjqnbsauvzq.supabase.co"
          test "$LOAD_SUPABASE_PROJECT_REF" = "vadyhuipwbtgbzpeisbn"
          test "$PRODUCTION_SUPABASE_PROJECT_REF" != "$LOAD_SUPABASE_PROJECT_REF"

      - name: Check out the approved source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove database and Function source match the reviewed fix
        run: >-
          git diff --exit-code
          d456c2dc3f04386597d73d71124bb7a4c5ae1329
          "$GITHUB_SHA" -- supabase/migrations supabase/functions

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reverify the Function-only fix source
        run: |
          pnpm check:repo
          pnpm check:deployment
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:functions

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Check Edge Function modules
        run: >-
          deno check --frozen
          --config supabase/functions/deno.json
          --lock supabase/functions/deno.lock
          supabase/functions/*/index.ts

      - name: Deploy only the reviewed join Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          pnpm exec supabase functions deploy join-cohort
          --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF"

      - name: Verify production backend readiness
        env:
          PRODUCTION_READINESS_SECRET: ${{ secrets.PRODUCTION_READINESS_SECRET }}
        run: node scripts/production-preflight.mjs --backend-only
